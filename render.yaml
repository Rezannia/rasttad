services:
  - type: web
    name: rasttad
    env: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:8080
      - key: DATABASE_URL
        fromDatabase:
          name: rasttad-db
          property: connectionString

databases:
  - name: rasttad-db
    plan: free
    databaseName: rasttad
    region: frankfurt